name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy container over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          IMAGE: ${{ needs.build.outputs.image }}
        with:
          host: 141.136.47.194
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH,DEPLOY_PORT,GHCR_TOKEN,GHCR_USERNAME,IMAGE
          script: |
            set -eu

            test -n "$DEPLOY_PATH"
            test -n "$DEPLOY_PORT"
            test -n "$GHCR_TOKEN"
            test -n "$GHCR_USERNAME"
            test -n "$IMAGE"

            case "$DEPLOY_PORT" in
              *[!0-9]*)
                echo "DEPLOY_PORT must be numeric"
                exit 1
                ;;
            esac

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            if [ ! -f ".env" ]; then
              echo "Missing environment file: $DEPLOY_PATH/.env"
              exit 1
            fi

            printf '%s' "$GHCR_TOKEN" |
              docker login ghcr.io \
                --username "$GHCR_USERNAME" \
                --password-stdin

            echo "Pulling image: $IMAGE"
            docker pull "$IMAGE"

            if docker container inspect fieldbook-app >/dev/null 2>&1; then
              echo "Removing existing container: fieldbook-app"
              docker rm --force fieldbook-app
            fi

            echo "Starting container on port: $DEPLOY_PORT"
            docker run --detach \
              --name fieldbook-app \
              --restart unless-stopped \
              --env-file "$DEPLOY_PATH/.env" \
              --publish "${DEPLOY_PORT}:3000" \
              "$IMAGE"

            echo "Container status:"
            docker ps --filter "name=^/fieldbook-app$"

            docker image prune --force